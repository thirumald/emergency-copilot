# Publishes web/usecases.html (self-contained static page) as the GitHub Pages site.
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy use-case page to GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["web/usecases.html", "web/ccc.html", "web/video/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp web/usecases.html _site/index.html
          cp web/usecases.html web/ccc.html _site/
          cp -r web/video _site/video
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
